<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 584 216" width="100%" role="img" aria-label="BDA Call Tracker Live Project Card">
  <defs>
    <linearGradient id="bgBda" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191d2b"/>
      <stop offset="100%" stop-color="#1b3036"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="580" height="212" rx="16" fill="url(#bgBda)" stroke="#27e8a7" stroke-opacity="0.38" stroke-width="1.5"/>
  <rect x="20" y="22" width="5" height="172" rx="2.5" fill="#27e8a7"/>

  <!-- Header & Live Pill -->
  <text x="40" y="48" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="21" font-weight="800" fill="#ffffff">BDA Call Tracker</text>
  <rect x="424" y="26" width="140" height="26" rx="13" fill="#0f2924" stroke="#27e8a7" stroke-opacity="0.65"/>
  <circle cx="442" cy="39" r="4" fill="#27e8a7"/>
  <text x="500" y="43" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.6" fill="#27e8a7">LIVE SITE ↗</text>

  <!-- Description -->
  <text x="40" y="84" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="14.5" fill="#cbd5e1">Lightweight browser productivity tool for Business</text>
  <text x="40" y="108" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="14.5" fill="#cbd5e1">Development Associates to log calls &amp; follow-ups.</text>
  <text x="40" y="132" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="14.5" fill="#27e8a7">Click card to open live deployment on GitHub Pages.</text>

  <!-- Tech Pills -->
  <g transform="translate(40, 158)" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="11.5" font-weight="700">
    <rect x="0" y="0" width="76" height="26" rx="6" fill="#131722" stroke="#e34f26" stroke-opacity="0.45"/>
    <text x="38" y="17" text-anchor="middle" fill="#f97316">HTML5</text>

    <rect x="86" y="0" width="68" height="26" rx="6" fill="#131722" stroke="#38bdf8" stroke-opacity="0.45"/>
    <text x="120" y="17" text-anchor="middle" fill="#38bdf8">CSS3</text>

    <rect x="164" y="0" width="92" height="26" rx="6" fill="#131722" stroke="#f7df1e" stroke-opacity="0.45"/>
    <text x="210" y="17" text-anchor="middle" fill="#f7df1e">JavaScript</text>

    <rect x="266" y="0" width="96" height="26" rx="6" fill="#131722" stroke="#27e8a7" stroke-opacity="0.45"/>
    <text x="314" y="17" text-anchor="middle" fill="#27e8a7">GH Pages</text>
  </g>
</svg>
