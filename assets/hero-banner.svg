<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" role="img" aria-label="Akhil Sabu - Odoo ERP Developer, Full-Stack Developer, Graphic Designer">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191d2b"/>
      <stop offset="52%" stop-color="#242938"/>
      <stop offset="100%" stop-color="#714B67"/>
    </linearGradient>
    <radialGradient id="glowMint" cx="82%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#27e8a7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#27e8a7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="18%" cy="85%" r="48%">
      <stop offset="0%" stop-color="#82aaff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#82aaff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27e8a7"/>
      <stop offset="50%" stop-color="#82aaff"/>
      <stop offset="100%" stop-color="#c792ea"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="1196" height="276" rx="18" fill="url(#bgGrad)" stroke="#82aaff" stroke-opacity="0.28" stroke-width="1.5"/>
  <rect x="2" y="2" width="1196" height="276" rx="18" fill="url(#glowMint)"/>
  <rect x="2" y="2" width="1196" height="276" rx="18" fill="url(#glowBlue)"/>

  <!-- Subtle Grid Dots -->
  <g fill="#ffffff" fill-opacity="0.06">
    <circle cx="880" cy="44" r="2"/><circle cx="910" cy="44" r="2"/><circle cx="940" cy="44" r="2"/><circle cx="970" cy="44" r="2"/><circle cx="1000" cy="44" r="2"/>
    <circle cx="880" cy="74" r="2"/><circle cx="910" cy="74" r="2"/><circle cx="940" cy="74" r="2"/><circle cx="970" cy="74" r="2"/><circle cx="1000" cy="74" r="2"/>
    <circle cx="880" cy="104" r="2"/><circle cx="910" cy="104" r="2"/><circle cx="940" cy="104" r="2"/><circle cx="970" cy="104" r="2"/><circle cx="1000" cy="104" r="2"/>
  </g>

  <!-- Right Graphic Motif: ERP Modules + Code + Bezier Vector -->
  <g transform="translate(885, 48)">
    <!-- Outer frame -->
    <rect x="0" y="0" width="256" height="184" rx="14" fill="#161925" fill-opacity="0.65" stroke="#c792ea" stroke-opacity="0.30" stroke-width="1.2"/>
    <!-- Window dots -->
    <circle cx="20" cy="18" r="4.5" fill="#ff5f56"/>
    <circle cx="36" cy="18" r="4.5" fill="#ffbd2e"/>
    <circle cx="52" cy="18" r="4.5" fill="#27c93f"/>
    <line x1="0" y1="34" x2="256" y2="34" stroke="#ffffff" stroke-opacity="0.1"/>

    <!-- Stylized ERP / Code / Design blocks -->
    <rect x="20" y="50" width="100" height="30" rx="6" fill="#714B67" fill-opacity="0.85" stroke="#c792ea" stroke-opacity="0.4"/>
    <text x="70" y="70" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">ODOO ERP</text>

    <rect x="132" y="50" width="104" height="30" rx="6" fill="#1e2a45" stroke="#82aaff" stroke-opacity="0.45"/>
    <text x="184" y="70" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="12" font-weight="700" fill="#82aaff">FULL-STACK</text>

    <rect x="20" y="92" width="216" height="30" rx="6" fill="#1b3336" stroke="#27e8a7" stroke-opacity="0.45"/>
    <text x="128" y="112" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="12" font-weight="700" fill="#27e8a7">GRAPHIC DESIGN &amp; UI/UX</text>

    <!-- Vector Bezier Wave -->
    <path d="M 24 156 C 72 126, 118 172, 166 140 C 194 124, 214 146, 232 138" fill="none" stroke="url(#accentLine)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="24" cy="156" r="3.5" fill="#27e8a7"/>
    <circle cx="166" cy="140" r="3.5" fill="#82aaff"/>
    <circle cx="232" cy="138" r="3.5" fill="#c792ea"/>
  </g>

  <!-- Left Content -->
  <g transform="translate(54, 48)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="290" height="28" rx="14" fill="#27e8a7" fill-opacity="0.14" stroke="#27e8a7" stroke-opacity="0.45"/>
    <circle cx="18" cy="14" r="4.5" fill="#27e8a7"/>
    <text x="32" y="18.5" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.1" fill="#27e8a7">ODOO ERP · FULL-STACK · DESIGN</text>

    <!-- Main Heading -->
    <text x="0" y="84" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="0.5" fill="#ffffff">Hi, I'm Akhil Sabu</text>

    <!-- Role Line -->
    <text x="0" y="122" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="21" font-weight="600" fill="#82aaff">Odoo ERP Developer  ·  Full-Stack Developer  ·  Graphic Designer</text>

    <!-- Gradient Divider -->
    <rect x="0" y="140" width="460" height="3" rx="1.5" fill="url(#accentLine)"/>

    <!-- Subtitle -->
    <text x="0" y="172" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#d8dee9">Engineering custom Odoo modules, modern web applications, and visual brand experiences.</text>
  </g>
</svg>
