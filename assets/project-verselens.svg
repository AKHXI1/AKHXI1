<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 584 216" width="100%" role="img" aria-label="VerseLens Chrome Extension Project Card">
  <defs>
    <linearGradient id="bgVl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191d2b"/>
      <stop offset="55%" stop-color="#242938"/>
      <stop offset="100%" stop-color="#452745"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="580" height="212" rx="16" fill="url(#bgVl)" stroke="#c792ea" stroke-opacity="0.38" stroke-width="1.5"/>
  <rect x="20" y="22" width="5" height="172" rx="2.5" fill="#c792ea"/>

  <!-- Header & Action Pill -->
  <text x="40" y="48" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="21" font-weight="800" fill="#ffffff">VerseLens</text>
  <rect x="424" y="26" width="140" height="26" rx="13" fill="#131722" fill-opacity="0.85" stroke="#c792ea" stroke-opacity="0.55"/>
  <text x="494" y="43" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.6" fill="#c792ea">GITHUB REPO ↗</text>

  <!-- Description -->
  <text x="40" y="84" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="14.5" fill="#cbd5e1">Spotify Lyrics &amp; Meaning Translator (Manifest V3 Extension)</text>
  <text x="40" y="108" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="14.5" fill="#cbd5e1">Line-by-line translated meanings &amp; Romanized phonetics</text>
  <text x="40" y="132" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="14.5" fill="#94a3b8">directly inside Spotify Web Player and Spicetify.</text>

  <!-- Tech Pills -->
  <g transform="translate(40, 158)" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="11.5" font-weight="700">
    <rect x="0" y="0" width="92" height="26" rx="6" fill="#131722" stroke="#f7df1e" stroke-opacity="0.45"/>
    <text x="46" y="17" text-anchor="middle" fill="#f7df1e">JavaScript</text>

    <rect x="102" y="0" width="108" height="26" rx="6" fill="#131722" stroke="#82aaff" stroke-opacity="0.45"/>
    <text x="156" y="17" text-anchor="middle" fill="#82aaff">Chrome MV3</text>

    <rect x="220" y="0" width="92" height="26" rx="6" fill="#131722" stroke="#c792ea" stroke-opacity="0.45"/>
    <text x="266" y="17" text-anchor="middle" fill="#c792ea">HTML / CSS</text>

    <rect x="322" y="0" width="88" height="26" rx="6" fill="#131722" stroke="#27e8a7" stroke-opacity="0.45"/>
    <text x="366" y="17" text-anchor="middle" fill="#27e8a7">Spicetify</text>
  </g>
